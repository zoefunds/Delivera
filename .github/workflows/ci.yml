name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            contracts/base/package-lock.json

      - name: Backend dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Base contract dependencies
        working-directory: contracts/base
        run: npm ci
      - name: Base contract tests
        working-directory: contracts/base
        run: npm test

      - name: GenLayer Python syntax
        run: python3 -m py_compile contracts/delivera.py
      - name: GenLayer dispute guard regression
        run: python3 -m unittest contracts/test_dispute_guards.py
